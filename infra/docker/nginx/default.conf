upstream aniyume_frontend {
    server frontend:3000;
}

upstream aniyume_backend {
    server backend:8000;
}

upstream aniyume_reverb {
    server reverb:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Laravel API and current Blade-admin routes are preserved without rewrites.
    location ^~ /api/ {
        proxy_pass http://aniyume_backend;
    }

    location ^~ /admin/ {
        proxy_pass http://aniyume_backend;
    }

    location = /login {
        proxy_pass http://aniyume_backend;
    }

    location = /up {
        proxy_pass http://aniyume_backend;
    }

    location ^~ /storage/ {
        proxy_pass http://aniyume_backend;
    }

    # Laravel Reverb websocket endpoint. Keep upgrade headers for ws://localhost/app/*.
    location ^~ /app/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://aniyume_reverb;
    }

    # Placeholder: future separate aniyume-admin service can be routed here when it exists.
    # location ^~ /admin-ui/ {
    #     proxy_pass http://admin:3001;
    # }

    location / {
        proxy_pass http://aniyume_frontend;
    }
}
