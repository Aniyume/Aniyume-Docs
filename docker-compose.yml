services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aniyume}
      POSTGRES_USER: ${POSTGRES_USER:-aniyume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aniyume_local_password}
    ports:
      - "${DB_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./aniyume-backend
      target: dev
    restart: unless-stopped
    env_file:
      - .env.docker.example
    environment:
      CONTAINER_ROLE: backend
    command: sh -c "test -f vendor/autoload.php || composer install --no-interaction --prefer-dist && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "${BACKEND_PUBLISHED_PORT:-8000}:8000"
    volumes:
      - ./aniyume-backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - backend-node-modules:/var/www/html/node_modules
      - backend-storage:/var/www/html/storage
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache
      - composer-cache:/tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue-worker:
    build:
      context: ./aniyume-backend
      target: dev
    restart: unless-stopped
    env_file:
      - .env.docker.example
    environment:
      CONTAINER_ROLE: queue-worker
    command: sh -c "test -f vendor/autoload.php || composer install --no-interaction --prefer-dist && php artisan queue:work --sleep=3 --tries=3 --timeout=300"
    volumes:
      - ./aniyume-backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - backend-node-modules:/var/www/html/node_modules
      - backend-storage:/var/www/html/storage
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache
      - composer-cache:/tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./aniyume-backend
      target: dev
    restart: unless-stopped
    env_file:
      - .env.docker.example
    environment:
      CONTAINER_ROLE: scheduler
    command: sh -c "test -f vendor/autoload.php || composer install --no-interaction --prefer-dist && php artisan schedule:work"
    volumes:
      - ./aniyume-backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - backend-node-modules:/var/www/html/node_modules
      - backend-storage:/var/www/html/storage
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache
      - composer-cache:/tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    build:
      context: ./aniyume-backend
      target: dev
    restart: unless-stopped
    env_file:
      - .env.docker.example
    environment:
      CONTAINER_ROLE: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: sh -c "test -f vendor/autoload.php || composer install --no-interaction --prefer-dist && php artisan reverb:start --host=0.0.0.0 --port=8080"
    ports:
      - "${REVERB_PUBLISHED_PORT:-8080}:8080"
    volumes:
      - ./aniyume-backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - backend-node-modules:/var/www/html/node_modules
      - backend-storage:/var/www/html/storage
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache
      - composer-cache:/tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./aniyume
      target: dev
    restart: unless-stopped
    env_file:
      - .env.docker.example
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "test -d node_modules/next || npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-3000}:3000"
    volumes:
      - ./aniyume:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PUBLISHED_PORT:-8088}:80"
    volumes:
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://127.0.0.1/nginx-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Admin container placeholder:
  # `aniyume-admin` directory is not present in this checkout, so this phase does
  # not create or run an admin app. Add a real admin service/profile here after
  # admin runtime ownership and framework are finalized.

volumes:
  db-data:
  redis-data:
  backend-vendor:
  backend-node-modules:
  backend-storage:
  backend-bootstrap-cache:
  composer-cache:
  frontend-node-modules:
  frontend-next-cache:
